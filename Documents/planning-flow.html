<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alikable Planning Flow</title>
<style>
  body { margin: 0; background: #fff; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 24px 16px; }
  svg { width: 100%; height: auto; display: block; }
  .h1 { font-size: 21px; font-weight: 600; fill: #111; }
  .band { fill: #F4F6FA; stroke: #C9D3E3; stroke-width: 1.2; }
  .chat { fill: #E3EDF9; stroke: #2F6FD6; stroke-width: 1.6; }
  .crew { fill: #ECECEA; stroke: #D3D3CF; stroke-width: 1.2; }
  .agent { fill: #EFEFED; stroke: #C6C6C1; stroke-width: 1.2; }
  .io { fill: #fff; stroke: #C6C6C1; stroke-width: 1.4; }
  .guard { fill: #FDF3DC; stroke: #F2B530; stroke-width: 1.4; }
  .guard-in { fill: #F3EBD9; stroke: #F2B530; stroke-width: 1.4; }
  .hitl { fill: #E3EDF9; stroke: #2F6FD6; stroke-width: 2; }
  .router { fill: #fff; stroke: #2F6FD6; stroke-width: 1.8; }
  .tool { fill: #fff; stroke: #9C9C97; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .mcp { fill: #EAF6EE; stroke: #2E9D5B; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .flow { stroke: #BDBDB8; stroke-width: 1.6; fill: none; }
  .link { stroke: #9C9C97; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .loop { stroke: #2F6FD6; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  .ckpt { fill: #fff; stroke: #6E6E69; stroke-width: 1.6; }
  .t-crew { font-size: 17px; font-weight: 600; fill: #1a1a1a; }
  .t-tag { font-size: 13px; fill: #777; }
  .t-name { font-size: 15.5px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
  .t-sub { font-size: 13.5px; fill: #555; text-anchor: middle; }
  .t-uses { font-size: 13.5px; fill: #555; }
  .t-lbl { font-size: 13px; fill: #555; }
  .t-blue { font-size: 13px; fill: #2F6FD6; }
  .t-key { font-size: 14px; fill: #333; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1280 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alikable planning flow: the Spec Writer, Copywriter and Spec Critic write the spec draft in up to 2 rounds, the user approves it at HITL #1 or asks for changes that are cleaned and replanned, and an approved spec must be valid JSON before site_spec.json is saved and the design job starts">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BDBDB8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FD6"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C9C97"/>
    </marker>
    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11.5" fill="#2F6FD6"/>
      <circle cx="12" cy="9" r="3.6" fill="#fff"/>
      <path d="M5.6 18.6 C6.6 14.8 9 13.6 12 13.6 C15 13.6 17.4 14.8 18.4 18.6 Z" fill="#fff"/>
    </symbol>
  </defs>

  <text class="h1" x="24" y="38">Planning: the Spec Writer, Copywriter and Spec Critic write the spec, then the user approves it at HITL #1</text>
  <rect class="band" x="24" y="58" width="1236" height="44" rx="8"/>
  <text class="t-uses" x="42" y="85"><tspan style="font-weight:600;fill:#1a1a1a">CrewAI Flow</tspan>  IntakeFlow (write_spec · add_changes · save_spec) · also the planning step of a change job · run_review_loop · max 2 rounds</text>
  <rect class="chat" x="24" y="124" width="48" height="682" rx="24"/>
  <use href="#user" x="36" y="136" width="24" height="24"/>
  <text class="t-blue" transform="translate(53 465) rotate(-90)" text-anchor="middle" style="font-size:14px"><tspan style="font-weight:600">User</tspan>  ·  reads the spec draft  ·  approves it (JSON editable) or asks for changes</text>

  <!-- Input -->
  <rect class="io" x="200" y="124" width="600" height="64" rx="10"/>
  <text class="t-name" x="500" y="150">Interview summary</text>
  <text class="t-sub" x="500" y="173">from the interview · or the current spec + a change (change job)</text>
  <line class="flow" x1="500" y1="188" x2="500" y2="220" marker-end="url(#ag)"/>

  <!-- Planning crew -->
  <rect class="crew" x="200" y="222" width="600" height="270" rx="10"/>
  <text class="t-crew" x="220" y="250">Planning crew</text>
  <text class="t-tag" x="341" y="250">· sequential · run_review_loop, up to 2 rounds</text>
  <use href="#user" x="768" y="232" width="22" height="22"/>
  <rect class="agent" x="220" y="268" width="270" height="62" rx="8"/>
  <text class="t-name" x="355" y="293">Spec Writer</text>
  <text class="t-sub" x="355" y="316">pages · features · build plan</text>
  <line class="flow" x1="490" y1="299" x2="508" y2="299" marker-end="url(#ag)"/>
  <rect class="agent" x="510" y="268" width="270" height="62" rx="8"/>
  <text class="t-name" x="645" y="293">Copywriter</text>
  <text class="t-sub" x="645" y="316">page text · [placeholders]</text>
  <line class="flow" x1="645" y1="330" x2="645" y2="350" marker-end="url(#ag)"/>
  <rect class="agent" x="510" y="352" width="270" height="62" rx="8"/>
  <text class="t-name" x="645" y="377">Spec Critic</text>
  <text class="t-sub" x="645" y="400">APPROVED or numbered fixes</text>
  <polyline class="loop" points="510,383 355,383 355,332" marker-end="url(#ab)"/>
  <text class="t-blue" x="232" y="405">fixes → next round</text>
  <text class="t-uses" x="220" y="446">uses: knowledge (design practices, Spec Critic only) · no memory</text>
  <text class="t-uses" x="220" y="468">every round&#x27;s review → spec_review_log.md</text>
  <line class="flow" x1="500" y1="492" x2="500" y2="524" marker-end="url(#ag)"/>
  <circle class="ckpt" cx="500" cy="509.0" r="5"/>
  <text class="t-lbl" x="514" y="516.0">site_spec_draft.json · approved, or the last draft after 2 rounds</text>

  <!-- HITL #1 -->
  <polygon class="hitl" points="500,526 690,564 500,602 310,564"/>
  <text class="t-name" x="500" y="560">HITL #1</text>
  <text class="t-sub" x="500" y="581">approve or ask for changes</text>
  <line class="loop" x1="72" y1="564" x2="308" y2="564" marker-end="url(#ab)"/>
  <text class="t-blue" x="82" y="556">reads</text>
  <polyline class="loop" points="690,564 858,564" marker-end="url(#ab)"/>
  <text class="t-blue" x="700" y="556">changes</text>
  <rect class="guard-in" x="860" y="520" width="380" height="88" rx="8"/>
  <text class="t-name" x="1050" y="547">add_changes (Python)</text>
  <text class="t-sub" x="1050" y="570">empty request → refused</text>
  <text class="t-sub" x="1050" y="591">secrets redacted · added to the summary</text>
  <polyline class="loop" points="1050,520 1050,440 802,440" marker-end="url(#ab)"/>
  <text class="t-blue" x="1062" y="486">replan</text>
  <line class="flow" x1="500" y1="602" x2="500" y2="634" marker-end="url(#ag)"/>
  <text class="t-lbl" x="512" y="625.0">approve · the JSON may be edited</text>

  <!-- save_spec -->
  <rect class="io" x="200" y="636" width="600" height="64" rx="10"/>
  <text class="t-name" x="500" y="662">save_spec (Python)</text>
  <text class="t-sub" x="500" y="685">must be valid JSON, or the problem is shown and nothing is saved</text>
  <polyline class="loop" points="200,668 74,668" marker-end="url(#ab)"/>
  <text class="t-blue" x="82" y="660">not JSON</text>
  <line class="flow" x1="500" y1="700" x2="500" y2="732" marker-end="url(#ag)"/>
  <circle class="ckpt" cx="500" cy="717.0" r="5"/>
  <text class="t-lbl" x="514" y="724.0">site_spec.json</text>
  <rect class="io" x="200" y="734" width="600" height="70" rx="35"/>
  <text class="t-name" x="500" y="763">Design job starts</text>
  <text class="t-sub" x="500" y="786">the project chat opens · next: the design diagram</text>

  <!-- Right column -->
  <rect class="io" x="860" y="124" width="380" height="170" rx="10"/>
  <text class="t-name" x="1050" y="159">Ways in</text>
  <text class="t-sub" x="1050" y="182">plan: after the interview</text>
  <text class="t-sub" x="1050" y="203">replan: after HITL #1 changes</text>
  <text class="t-sub" x="1050" y="224">change job (new page or feature):</text>
  <text class="t-sub" x="1050" y="245">no HITL #1, the spec is saved</text>
  <text class="t-sub" x="1050" y="266">unless it is not valid JSON</text>
  <text class="t-key" x="200" y="852" style="font-weight:600;fill:#555">Key</text>
  <rect class="guard-in" x="202" y="866" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="880">Guardrail</text>
  <rect class="agent" x="202" y="898" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="912">Agent</text>
  <rect class="io" x="202" y="930" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="944">Python step, input or output</text>
  <polygon class="hitl" points="477,866 492,876 477,886 462,876"/>
  <text class="t-key" x="506" y="880">Approval gate</text>
  <line class="loop" x1="462" y1="907" x2="492" y2="907"/>
  <text class="t-key" x="506" y="912">Loop back / user action</text>
  <circle class="ckpt" cx="477" cy="939" r="5"/>
  <text class="t-key" x="506" y="944">Output saved</text>
</svg>
</div>
</body>
</html>
