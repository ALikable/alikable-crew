<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alikable Implementation Flow</title>
<style>
  body { margin: 0; background: #fff; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 24px 16px; }
  svg { width: 100%; height: auto; display: block; }
  .h1 { font-size: 21px; font-weight: 600; fill: #111; }
  .band { fill: #F4F6FA; stroke: #C9D3E3; stroke-width: 1.2; }
  .chat { fill: #E3EDF9; stroke: #2F6FD6; stroke-width: 1.6; }
  .crew { fill: #ECECEA; stroke: #D3D3CF; stroke-width: 1.2; }
  .agent { fill: #EFEFED; stroke: #C6C6C1; stroke-width: 1.2; }
  .io { fill: #fff; stroke: #C6C6C1; stroke-width: 1.4; }
  .guard { fill: #FDF3DC; stroke: #F2B530; stroke-width: 1.4; }
  .guard-in { fill: #F3EBD9; stroke: #F2B530; stroke-width: 1.4; }
  .hitl { fill: #E3EDF9; stroke: #2F6FD6; stroke-width: 2; }
  .router { fill: #fff; stroke: #2F6FD6; stroke-width: 1.8; }
  .tool { fill: #fff; stroke: #9C9C97; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .mcp { fill: #EAF6EE; stroke: #2E9D5B; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .flow { stroke: #BDBDB8; stroke-width: 1.6; fill: none; }
  .link { stroke: #9C9C97; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
  .loop { stroke: #2F6FD6; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  .ckpt { fill: #fff; stroke: #6E6E69; stroke-width: 1.6; }
  .t-crew { font-size: 17px; font-weight: 600; fill: #1a1a1a; }
  .t-tag { font-size: 13px; fill: #777; }
  .t-name { font-size: 15.5px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
  .t-sub { font-size: 13.5px; fill: #555; text-anchor: middle; }
  .t-uses { font-size: 13.5px; fill: #555; }
  .t-lbl { font-size: 13px; fill: #555; }
  .t-blue { font-size: 13px; fill: #2F6FD6; }
  .t-key { font-size: 14px; fill: #333; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1280 1130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alikable implementation flow: the API Integrator and Page Builder return files, Python saves them into site/ behind a file guardrail that keeps writes inside site/ and locks styles.css, the Code Reviewer checks the files with the Build Checker and a read-only MCP Filesystem, and changes loop back as feedback for up to 3 rounds before the Polish flow">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BDBDB8"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6FD6"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C9C97"/>
    </marker>
    <symbol id="user" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11.5" fill="#2F6FD6"/>
      <circle cx="12" cy="9" r="3.6" fill="#fff"/>
      <path d="M5.6 18.6 C6.6 14.8 9 13.6 12 13.6 C15 13.6 17.4 14.8 18.4 18.6 Z" fill="#fff"/>
    </symbol>
  </defs>

  <text class="h1" x="24" y="38">Implementation: the builders write site/, Python saves it, the Code Reviewer checks it, up to 3 rounds</text>
  <rect class="band" x="24" y="58" width="1236" height="44" rx="8"/>
  <text class="t-uses" x="42" y="85"><tspan style="font-weight:600;fill:#1a1a1a">run_implementation_phase</tspan>  first build job or change job · build runner · up to 3 rounds · then the Polish flow</text>

  <!-- Input -->
  <rect class="io" x="200" y="124" width="600" height="64" rx="10"/>
  <text class="t-name" x="500" y="150">Spec + design</text>
  <text class="t-sub" x="500" y="173">site_spec.json · design.json · the user&#x27;s change only when routed here</text>
  <line class="flow" x1="500" y1="188" x2="500" y2="220" marker-end="url(#ag)"/>

  <!-- Implementation crew -->
  <rect class="crew" x="200" y="222" width="600" height="176" rx="10"/>
  <text class="t-crew" x="220" y="250">Implementation crew</text>
  <text class="t-tag" x="393" y="250">· sequential · each returns SiteBuild files</text>
  <rect class="agent" x="220" y="268" width="270" height="62" rx="8"/>
  <text class="t-name" x="355" y="293">API Integrator</text>
  <text class="t-sub" x="355" y="316">config.js · mock-data.js · api.js</text>
  <line class="flow" x1="490" y1="299" x2="508" y2="299" marker-end="url(#ag)"/>
  <rect class="agent" x="510" y="268" width="270" height="62" rx="8"/>
  <text class="t-name" x="645" y="293">Page Builder</text>
  <text class="t-sub" x="645" y="316">every page + its js/&lt;page&gt;.js</text>
  <text class="t-uses" x="220" y="358">inputs: spec · design · feedback · previous build (none in round 1)</text>
  <text class="t-uses" x="220" y="380">uses: GPT-5.6 Luna (Page Builder) · plain scripts, no modules</text>
  <line class="flow" x1="500" y1="398" x2="500" y2="430" marker-end="url(#ag)"/>
  <text class="t-lbl" x="512" y="421.0">files</text>

  <!-- Save -->
  <rect class="io" x="200" y="432" width="600" height="86" rx="10"/>
  <text class="t-name" x="500" y="458">Save the build (Python)</text>
  <text class="t-sub" x="500" y="481">collect_files · reset_site: empty site/, design styles.css + [hidden] rule</text>
  <text class="t-sub" x="500" y="502">apply_changes · ensure_home_page: index.html redirect if missing</text>
  <rect class="guard" x="200" y="530" width="600" height="36" rx="8"/>
  <text class="t-sub" x="500" y="553" style="fill:#333">File guardrail (Python): paths inside site/ only · styles.css locked to the design</text>
  <line class="flow" x1="500" y1="566" x2="500" y2="598" marker-end="url(#ag)"/>
  <circle class="ckpt" cx="500" cy="583.0" r="5"/>
  <text class="t-lbl" x="514" y="590.0">site/</text>

  <!-- Code Review crew -->
  <rect class="crew" x="200" y="600" width="600" height="176" rx="10"/>
  <text class="t-crew" x="220" y="628">Code Review crew</text>
  <text class="t-tag" x="367" y="628">· reads the saved files on disk</text>
  <rect class="mcp" x="220" y="646" width="270" height="62" rx="8"/>
  <text class="t-name" x="355" y="671">MCP Filesystem</text>
  <text class="t-sub" x="355" y="694">read-only · list + read site/</text>
  <line class="link" x1="490" y1="677" x2="508" y2="677" marker-end="url(#at)"/>
  <rect class="agent" x="510" y="646" width="270" height="62" rx="8"/>
  <text class="t-name" x="645" y="671">Code Reviewer</text>
  <text class="t-sub" x="645" y="694">5 checks · FAIL quotes the rule</text>
  <text class="t-uses" x="220" y="736">uses: Build Checker · GPT-5.6 Luna</text>
  <text class="t-uses" x="220" y="758">checks: build · pages · scripts · design · features</text>
  <line class="flow" x1="500" y1="776" x2="500" y2="808" marker-end="url(#ag)"/>
  <polygon class="router" points="310,845 340,810 660,810 690,845 660,880 340,880"/>
  <text class="t-name" x="500" y="841">approved?</text>
  <text class="t-sub" x="500" y="863">first line of the review</text>
  <polyline class="loop" points="310,845 150,845 150,299 198,299" marker-end="url(#ab)"/>
  <text class="t-blue" x="162" y="837">changes needed</text>
  <text class="t-blue" transform="translate(138 572) rotate(-90)" text-anchor="middle">round &lt; 3 · review → feedback · site/ → previous build</text>
  <line class="flow" x1="500" y1="880" x2="500" y2="912" marker-end="url(#ag)"/>
  <circle class="ckpt" cx="500" cy="897.0" r="5"/>
  <text class="t-lbl" x="514" y="904.0">approved, or 3 rounds: the last build is kept · code_review_log.md</text>
  <rect class="io" x="200" y="914" width="600" height="70" rx="35"/>
  <text class="t-name" x="500" y="943">Polish flow</text>
  <text class="t-sub" x="500" y="966">checks and fixes the build · next: the polish diagram</text>

  <!-- Right column -->
  <rect class="io" x="860" y="124" width="380" height="150" rx="10"/>
  <text class="t-name" x="1050" y="160">Where it starts</text>
  <text class="t-sub" x="1050" y="183">first build: from scratch</text>
  <text class="t-sub" x="1050" y="204">routed here: the user&#x27;s change,</text>
  <text class="t-sub" x="1050" y="225">starting from the current files</text>
  <text class="t-sub" x="1050" y="246">after Planning or Design: from scratch</text>
  <rect class="tool" x="860" y="646" width="380" height="130" rx="10"/>
  <text class="t-name" x="1050" y="683">Build Checker (tool)</text>
  <text class="t-sub" x="1050" y="706">local links + assets exist · CDN allowlist</text>
  <text class="t-sub" x="1050" y="727">valid JSON · no secrets</text>
  <text class="t-sub" x="1050" y="748">no browser</text>
  <line class="link" x1="860" y1="677" x2="782" y2="677" marker-end="url(#at)"/>
  <text class="t-key" x="200" y="1030" style="font-weight:600;fill:#555">Key</text>
  <rect class="guard" x="202" y="1044" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="1058">Guardrail</text>
  <rect class="agent" x="202" y="1076" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="1090">Agent</text>
  <rect class="io" x="202" y="1108" width="30" height="18" rx="6"/>
  <text class="t-key" x="246" y="1122">Python step, input or output</text>
  <polygon class="router" points="462,1053 468,1044 486,1044 492,1053 486,1062 468,1062"/>
  <text class="t-key" x="506" y="1058">Router (decision)</text>
  <line class="loop" x1="462" y1="1085" x2="492" y2="1085"/>
  <text class="t-key" x="506" y="1090">Loop back</text>
  <circle class="ckpt" cx="477" cy="1117" r="5"/>
  <text class="t-key" x="506" y="1122">Output saved</text>
  <rect class="tool" x="722" y="1044" width="30" height="18" rx="6"/>
  <text class="t-key" x="766" y="1058">Tool</text>
  <rect class="mcp" x="722" y="1076" width="30" height="18" rx="6"/>
  <text class="t-key" x="766" y="1090">MCP server</text>
</svg>
</div>
</body>
</html>
