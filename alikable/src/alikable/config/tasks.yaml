# Alikable tasks, grouped by crew to match Documents/Agent_Diagram.png and agents.yaml.
# Data moves between tasks inside a crew with `context`. Data moves between crews
# through inputs ({site_spec}, {design}), because the Flow owns site_spec.json.
# Review loops, approval gates and per-crew round limits belong to the Flow, not here.

# ---------------------------------------------------------------- Planning crew

interview_task:
  description: >
    Read the intake form and the answers so far, then decide what is still
    unclear: purpose, audience, pages, look and feel, the software qualities the
    user cares about, and whether the app must call an existing API (base URL,
    endpoints, request and response shapes, auth method).
    Ask at most 4 short questions, never one that is already answered, each with
    a short header and 2 to 4 likely answers to pick from, each explained in one
    line, the one you recommend first and marked "(Recommended)". Ask no
    questions once nothing important is unclear.
    Never ask for secrets. Only front-end work in HTML, CSS and JavaScript is in scope.

    Intake form: {intake_form}

    Answers so far ("None" means this is the first round): {answers}
  expected_output: >
    This round's questions (none when the interview is done) and a summary of the
    user's requirements under these headings: purpose, audience, pages, look and
    feel, qualities, API details, open questions.
  agent: discovery_interviewer

spec_writing_task:
  description: >
    Write site_spec.json from the interview summary and nothing else. For every
    page list what is on it, its features and the API endpoints it uses. Record the
    overall style, the qualities the user picked and how to implement them, and any
    other notes. End with an ordered build plan.

    Interview summary: {interview_summary}

    Feedback from the Spec Critic on the previous round (fix exactly these
    points and keep everything else; "None" means this is the first round):
    {feedback}
  expected_output: >
    Valid JSON only, without '```'.
  agent: spec_writer
  output_file: output/projects/{chat_id}/site_spec_draft.json   # site_spec.json is saved only once the user approves (HITL #1)

copywriting_task:
  description: >
    Add the text for every page to the spec. Use the user's own content wherever
    they gave it; otherwise use clearly marked placeholders such as [Company name].
    Never invent facts about the user's business.
  expected_output: >
    The complete updated site_spec.json. Valid JSON only, without '```'.
  agent: copywriter
  context: [spec_writing_task]
  output_file: output/projects/{chat_id}/site_spec_draft.json   # site_spec.json is saved only once the user approves (HITL #1)

spec_review_task:
  description: >
    Check the spec against the interview summary. Every page, feature, endpoint and
    style choice must trace back to something the user said, nothing they asked for
    may be missing, and the plan must be buildable as a static HTML, CSS and
    JavaScript site.

    Interview summary: {interview_summary}
  expected_output: >
    The single word APPROVED, or a numbered list of concrete fixes, each naming the
    part of the spec it applies to.
  agent: spec_critic
  context: [copywriting_task]

# ------------------------------------------------------------------ Design crew

design_task:
  description: >
    Produce the design system for this spec, starting from the preexisting design
    templates and avoiding a generic AI-generated look. Keep everything readable so
    the user can edit it by hand. The page layouts use only classes defined in
    your stylesheet, never style attributes, and hide elements with the hidden
    attribute.

    Site spec: {site_spec}

    Feedback from the Design Critic on the previous round (fix exactly these
    points and keep everything else; "None" means this is the first round):
    {feedback}
  expected_output: >
    The design as separate parts: which template you started from and why; the
    complete stylesheet (styles.css) with design tokens and a comment on each
    decision; an HTML snippet for every component; a full HTML layout for every
    page in the site spec that links styles.css and uses the component classes;
    and design notes for the Page Builder.
  agent: design_system_designer
  guardrail: >
    The stylesheet is valid CSS and every page in the site spec has a layout.
  output_file: output/projects/{chat_id}/design/design.json


design_review_task:
  description: >
    Check the design against the site spec and the design templates using this
    checklist. Mark each check PASS or FAIL with a one-line reason.
    1. Accent color: matches the spec's style and brand_colors
       (for example, "blue accent" means the accent must be blue).
    2. Fonts: match the spec's fonts (a sans-serif request means no serif fonts).
    3. Theme: light or dark exactly as the spec says.
    4. Pages: every page in the spec has a layout.
    5. Look: no emoji used as icons, no purple-to-blue gradients, no style
       attributes in the page layouts, and the stylesheet includes
       [hidden] { display: none !important; }.
    6. Quality: follows the quality bar in the design templates. Every page has
       a clear header; cards use padding from the spacing scale and a border or
       shadow; every button, link and input has hover and focus-visible styles
       in the stylesheet; every list has an empty state and a loading state.
    Only these 6 checks decide approval. You may list other small suggestions
    under "Optional", but they never make the answer CHANGES NEEDED.

    Site spec: {site_spec}
  expected_output: >
    First line: APPROVED only if all 6 checks PASS, otherwise CHANGES NEEDED.
    Then the 6 checks, each PASS or FAIL with a one-line reason.
    Then one concrete fix for each FAIL, and any optional suggestions.
  agent: design_critic
  context: [design_task]  # ---------------------------------------------------------- Implementation crew

api_integration_task:
  description: >
    Write the data layer of the site as three plain JavaScript files (not modules:
    no import or export). Always write all three, even when the spec has no API
    or no endpoints: then js/api.js works only with the mock data.
    js/config.js defines one global value, API_BASE_URL, from the spec (empty if
    there is none).
    js/mock-data.js holds all sample data as plain global values (for example
    var MOCK_TASKS = [...]), so it is easy to find and edit.
    js/api.js defines one global async function per endpoint in the spec, with
    loading and error handling, and holds no sample data itself. If the spec says
    to use mock data, or has no API, return data with exactly the same shape as
    the real responses, so switching to the real API only changes js/config.js.
    In mock mode, keep the data in localStorage, starting from js/mock-data.js the
    first time, so changes survive a page refresh.
    Never put API keys or secrets in the code.
    For a mock login token use exactly the value 'demo-token', never a long string.
    In mock mode, check tokens by comparing with the fixed text 'demo-token', never
    with a variable set at login: every page loads the scripts again from scratch.
    In mock mode, login accepts username 'alikable' and password 'password'.

    Site spec: {site_spec}

    Feedback from the Code Reviewer on the previous round (fix exactly these
    points; "None" means this is the first round):
    {feedback}

    The site's files from the previous round ("None" in the first round). If there
    are any, start from your js/config.js, js/mock-data.js and js/api.js and keep
    every function name the pages already call:
    {previous_build}
  expected_output: >
    js/config.js, js/mock-data.js and js/api.js as files with their complete
  agent: api_integrator

page_build_task:
  description: >
    Build every page in the site spec as a complete HTML file, using the design's
    page layout for that page as the starting point. The design layouts are not in
    the site: you must return the full HTML of every page (for example index.html
    and tasks.html) as well as its script. styles.css from the design is
    already in the site next to the pages: link it exactly as
    <link rel="stylesheet" href="styles.css">, use its classes and do not rewrite it.
    Each page's JavaScript goes in its own file in js/ (for example js/tasks.js).
    At the end of <body>, every page loads exactly these four plain scripts in
    this order, with no type="module" and no inline scripts:
    <script src="js/config.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/<page>.js"></script>
    Page scripts call the global functions from js/api.js directly (no import),
    using exactly the function names the API Integrator wrote in its js/api.js.
    To hide an element use the hidden attribute, never a style attribute.
    The design layouts show sample messages (errors, success, loading, empty
    states) so you can see how they look. On the real pages these start hidden
    and appear only when the page script shows them.
    Use only class names that exist in styles.css, in the HTML and in the page
    scripts. If the design layout uses a class that is not in styles.css, replace
    it with an existing class or remove it.
    Every feature listed for each page in the spec must work end to end, using
    the design's elements for it:
    - Every form is handled in the page script (event.preventDefault()) and never
      submits to a URL; remove any action attribute from the design layout.
    - Every data action shows loading while it runs, then success or an error
      message, using the design's loading, success and error elements.
    - Every list shows its empty state when it has no items.
    - Destructive actions (such as delete) ask for confirmation first, using the
      design's confirm dialog if it has one.
    - After a change (add or delete), refresh the data so the page shows it.
    - Pages that need login send the user to the login page when there is no
      token (and on a 401 only if the spec has a real API).

    Site spec: {site_spec}

    Design: {design}

    Feedback from the Code Reviewer on the previous round (fix exactly these
    points; "None" means this is the first round):
    {feedback}

    Your files from the previous round ("None" in the first round). If there are
    any, start from them and change only what the feedback asks, keeping
    everything that already works:
    {previous_build}
  expected_output: >
    Every HTML page (one file per page in the spec) and every page script as files
    with their complete contents, and a short note on how the pages use js/api.js.
  agent: page_builder
  context: [api_integration_task]

code_review_task:
  description: >
    Review the built site below against the spec using this checklist. Mark each
    check PASS or FAIL with a one-line reason.
    1. Build: run the Build Checker tool. Any error is a FAIL.
    2. Pages: every page in the spec exists as a file.
    3. Scripts: every page ends by loading exactly js/config.js, js/mock-data.js,
       js/api.js and its own js/<page>.js as plain scripts, in that order, with no
       inline scripts and no modules; the page script gets all data by calling
       functions from js/api.js.
    4. Design: every page links styles.css and uses its classes, with no style
       attributes.
    5. Features: every feature the spec lists for each page is wired in its page
       script: forms use event.preventDefault() and have no action attribute,
       loading, empty, error and success elements are shown at the right time,
       delete asks for confirmation, the data refreshes after a change, and pages
       that need login redirect when there is no token (and on a 401 only if the
       spec has a real API).
    Only these 5 checks decide approval. Do not judge anything else.
    A FAIL must quote the words of the check that are broken; if no words of a
    check are broken, that check is a PASS.
    If index.html is not a page in the spec, it is a small redirect page added by
    the system: skip checks 3 to 5 for it.
    styles.css is the approved design and cannot be changed: every fix must be
    in the pages or their scripts, using classes that already exist in styles.css.
    You can also list and open the site's files with your file tools: use them to
    double-check a file before you mark a check FAIL. Write paths as shown in the
    site files, like js/api.js, without a leading slash; use . for the whole site.
    
    Site spec: {site_spec}

    Site files: {site_files}
  expected_output: >
    First line: APPROVED only if all 5 checks PASS, otherwise CHANGES NEEDED.
    Then the 5 checks, each PASS or FAIL with a one-line reason.
    Then at most 5 fixes, one line each, naming the file and the exact change.
    Never include file contents.
  agent: code_reviewer

# ---------------------------------------------------------- Polish & Iterate crew

qa_task:
  description: >
    Test the built site. First run the Build Checker and report every error it
    finds as a high severity bug. Then go through every page as a user would:
    follow every link and button, submit every form and trace what the JavaScript
    does, looking for broken links, missing elements, script errors and features
    from the spec that are missing or do not work. You cannot open a browser yet,
    so work from the files below and report only bugs you can point to in them.

    Site spec: {site_spec}

    Site files: {site_files}
  expected_output: >
    Every bug found, each with its page, the steps to reproduce it, what happens,
    what should happen and its severity. An empty list if there are none.
  agent: qa_tester

consistency_audit_task:
  description: >
    Compare the pages side by side, and against the spec and the design, and flag
    anything that breaks them: off-palette colors, one-off spacing or fonts,
    components styled differently on different pages, and anything that
    contradicts the requirements. Report real inconsistencies only, not matters of
    taste, and give the exact change that would fix each one.

    Site spec: {site_spec}

    Design: {design}

    Site files: {site_files}
  expected_output: >
    Every inconsistency found, each with its page, the rule it breaks, what the site
    does now, the change to make and its severity. An empty list if there are none.
  agent: consistency_auditor

fix_task:
  description: >
    Fix this one problem in the built site with the smallest change that fixes it,
    without breaking anything else. Change only what this problem needs. If the
    files below show it is already fixed, it is not a real problem, or it cannot be
    fixed in HTML, CSS and JavaScript, change nothing and say why. Load scripts only
    from allowlisted CDN libraries and never add secrets.

    Problem: {issue}

    Site spec: {site_spec}

    Site files: {site_files}
  expected_output: >
    fixed with the path and complete new contents of every file you changed (paths
    exactly as in the site files), or skipped with the reason. One line saying what
    you changed.
  agent: fixer

# ---------------------------------------------------------- Deploy Guide crew

deploy_guide_task:
  description: >
    Write DEPLOY.md: step-by-step instructions a beginner can follow to deploy the
    packaged site on {host_name} themselves. The site is already packaged as
    site.zip and smoke-tested; the release report below says what is in the package
    and what failed. You can run the Release Builder again to re-check the package.
    DEPLOY.md is shipped inside site.zip, next to index.html.

    Cover only {host_name}, using the deploy notes below. Only name files that are
    in the package, exactly as listed there. If the site calls an API, say exactly
    which line of js/config.js to change for the real API base URL, how to switch
    off mock data if js/config.js has a switch for it, and the CORS change the
    backend needs. Never deploy anything yourself and never include secrets, API
    keys, tokens or account passwords (the demo login 'alikable' / 'password' for
    mock mode is fine).

    Use exactly these level-2 headings, in this order: {headings}

    Detail: {detail}. {detail_rule}

    If the release report lists failures, the Known problems section lists each
    one in plain words and what to do about it.

    Deploy notes: {deploy_notes}

    Release report: {release_report}

    js/config.js: {config_js}

    Polish report: {polish_summary}

    Site spec: {site_spec}

    Problems with your previous guide (fix exactly these and keep everything else;
    "None" means this is the first round): {feedback}
  expected_output: >
    DEPLOY.md formatted as markdown without '```' around the whole document,
    starting with a level-1 title.
  agent: deploy_guide_writer

# ---------------------------------------------------------------- Change Router

route_change_task:
  description: >
    Decide which crew handles this change with the least rework: small fixes go to
    polish, behavior or code changes that keep the spec and design go to
    implementation, style changes go to design, new pages or features go to
    planning. If the request is too vague to route, choose clarify and ask the user
    one clarifying question instead.

    Change request: {change_request}

    Site spec: {site_spec}
  expected_output: >
    The crew (planning, design, implementation, polish or clarify) and the request
    restated clearly for that crew, or the clarifying question.
  agent: change_router

# -------------------------------------------------------------------- Main chat

chat_task:
  description: >
    Handle the user's latest message in the project chat by choosing one action.
    reply: a question or conversation about the project. Answer it from the site
    spec, the conversation and any finished background checks.
    change: the user wants the site changed. Restate the change clearly and
    completely for the Change Router, and tell the user it is on its way.
    check: the user wants something investigated without changing it. Pick the
    reviewers to run in the background (qa_tester, consistency_auditor,
    code_reviewer, spec_critic, design_critic) and the question for them.
    approve: only when the build is waiting for approval and the user approves it.
    Also note the static host they want to deploy on (netlify, vercel, github_pages
    or s3) and how detailed a deploy guide they want (quick, standard or detailed),
    if they said.
    reject: only when the build is waiting for approval and the user wants it undone.
    This restores the last approved build and drops every change since; if the user
    only wants part of it changed, choose change instead.
    If background jobs have finished, summarize their results in your reply. If the
    user asks about progress, answer from the job list. Never say work is done while
    its job is still queued or running.

    Waiting for approval: {awaiting_approval}

    Background jobs: {jobs}

    Conversation so far: {history}

    Site spec: {site_spec}

    Latest message: {message}
  expected_output: >
    The action, the reply to show the user, and for change or check the details
    the next step needs.
  agent: chat_agent
